services:
  postgres:
    image: postgres:18-alpine
    container_name: koda-postgres
    environment:
      POSTGRES_DB: koda
      POSTGRES_USER: koda
      POSTGRES_PASSWORD: kodaadmin
    ports:
      # Só a própria máquina alcança o banco.
      - "127.0.0.1:5433:5432"
    volumes:
      - koda-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koda -d koda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  koda-pgdata:
