services:
  postgres:
    image: postgres:16-alpine
    container_name: koda-postgres
    environment:
      POSTGRES_DB: koda
      POSTGRES_USER: koda
      POSTGRES_PASSWORD: kodaadmin
    ports:
      - "5433:5432"
    volumes:
      - koda-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koda -d koda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  koda-pgdata:
