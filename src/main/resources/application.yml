spring:
  application:
    name: koda
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/koda
    username: koda
    password: kodaadmin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user

server:
  # Só a própria máquina enxerga o servidor. Em produção, defina KODA_SERVIDOR_ENDERECO=0.0.0.0 atrás de um proxy.
  address: ${KODA_SERVIDOR_ENDERECO:127.0.0.1}
  servlet:
    session:
      cookie:
        name: KODA_SESSAO
        http-only: true
        same-site: lax
        # Em produção (HTTPS), defina KODA_COOKIE_SEGURO=true.
        secure: ${KODA_COOKIE_SEGURO:false}

koda:
  seguranca:
    chave-criptografia: ${TOKEN_ENCRYPTION_KEY}
  github:
    api-url: https://api.github.com
  ia:
    provedor: ${KODA_IA_PROVEDOR:falso}
    url: ${KODA_IA_URL:}
    chave: ${KODA_IA_CHAVE:}
    modelo: ${KODA_IA_MODELO:}
  frontend:
      url: http://localhost:3000