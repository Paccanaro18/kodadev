# Configuração só dos testes. Ela vence o application.yml (o .properties tem precedência sobre o .yml).
# Os testes nunca usam o banco de desenvolvimento, o .env nem o provedor de IA real.

# Não importa o .env da raiz: o resultado dos testes não pode depender do que cada pessoa tem nele.
spring.config.import=

# Banco próprio dos testes. O BancoDeTesteInicializador cria o banco se ele ainda não existir.
spring.datasource.url=jdbc:postgresql://localhost:5433/koda_test

# Valores de teste, sem valor nenhum de verdade. A chave abaixo é a sequência de bytes 0 a 31 em Base64.
spring.security.oauth2.client.registration.github.client-id=id-de-teste
spring.security.oauth2.client.registration.github.client-secret=segredo-de-teste
koda.seguranca.chave-criptografia=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

# Provedor de IA falso, sempre.
koda.ia.provedor=falso
koda.ia.url=
koda.ia.chave=
koda.ia.modelo=
